events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth:8001;
    }

    upstream judge_service {
        server judge:8002;
    }

    upstream leaderboard_service {
        server leaderboard:8003;
    }

    upstream mentor_service {
        server mentor:8004;
    }

    upstream backend_service {
        server backend:5000;
    }

    server {
        listen 80;

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Auth service
        location /api/v1/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Judge service (code submissions)
        location /api/v1/submissions {
            proxy_pass http://judge_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/v1/problems {
            proxy_pass http://judge_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Leaderboard service
        location /api/v1/leaderboard {
            proxy_pass http://leaderboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Mentor/AI service
        location /api/v1/mentor {
            proxy_pass http://mentor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # Legacy Flask backend (existing routes)
        location /api/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket support for judge service
        location /ws/ {
            proxy_pass http://judge_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
